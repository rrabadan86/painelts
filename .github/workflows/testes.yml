# Testes automáticos a cada envio: contas (unitários), todas as telas da apresentação no computador e no celular, as telas
# por perfil no painel de verdade e as datas difíceis. Resultado aparece como ✓ / ✗ no commit. Se falhar, o relatório
# com as telas fica em "Artifacts" da execução.
# Rodada noturna (schedule): a bateria completa no main toda madrugada, mesmo sem mudança — falha que depende do dia
# (virada de mês, domingo, data de validade que muda de faixa) aparece de manhã, não na loja. Ela NÃO grava resultado
# no ramo "testes" (o job "registrar" só roda em push no main), então não libera nem bloqueia versão para a VPS.
name: Testes
on:
  push:
    branches-ignore: [testes]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *' # 03:17 em Brasília
concurrency:
  # a rodada noturna tem grupo próprio: nunca cancela os testes de um push no main (o "registrar" gravaria "cancelled")
  group: testes-${{ github.ref }}-${{ github.event_name == 'schedule' && 'noturna' || 'envio' }}
  cancel-in-progress: true
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contas (unitários)
        run: npm test
      # usa um WhatsApp de mentira: não instala a biblioteca do WhatsApp nem o Chromium
      - name: Robô do WhatsApp (unitários)
        run: node --test zap/tests/*.test.js
      - name: Navegador
        run: npx playwright install --with-deps chromium
      - name: Telas (computador e celular)
        run: npx playwright test
        env:
          CI: '1'
      # painel de verdade (não a apresentação): entra como franqueado, gerente e vendedora (tests/perfis)
      - name: Telas por perfil
        if: success() || failure()
        run: npx playwright test -c playwright.perfis.config.js
        env:
          CI: '1'
      # 1º do mês, último dia, domingo com a loja fechada e 1º de janeiro (tests/datas)
      - name: Telas em datas difíceis
        if: success() || failure()
        run: npx playwright test -c playwright.datas.config.js
        env:
          CI: '1'
      - name: Relatório das telas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-telas
          path: |
            playwright-report/
            playwright-report-perfis/
            playwright-report-datas/
          retention-days: 7

  # resultado de cada versão do main no ramo "testes" (arquivo resultados.txt): o atualizador da VPS lê
  # e só instala versões que passaram. O painel mostra ✓ / ✗ em "Atualizações do painel".
  registrar:
    needs: testes
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gravar o resultado
        env:
          RES: ${{ needs.testes.result }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git init -q r && cd r
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4 5 6; do
            if git fetch -q --depth 1 origin testes 2>/dev/null; then git checkout -q -B testes FETCH_HEAD; else git checkout -q --orphan testes; git rm -rqf . 2>/dev/null || true; fi
            touch resultados.txt
            printf '%s\t%s\t%s\t%s\n' "$GITHUB_SHA" "$RES" "$(date -Iseconds)" "$URL" >> resultados.txt
            tail -n 400 resultados.txt > t && mv t resultados.txt
            git add resultados.txt
            git -c user.name='testes automáticos' -c user.email='testes@painel.local' commit -qm "testes: ${GITHUB_SHA::7} ${RES}"
            git push -q origin HEAD:testes && exit 0
            sleep $((RANDOM % 6 + 2))
          done
          exit 1

services:
  teashop-painel:
    build: .
    container_name: teashop-painel
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      COLETOR_URL: http://coletor:8000
    volumes:
      - ./config:/app/config   # lojas.json (lojas, usuários, tokens)
      - ./dados:/data          # planilhas de cada loja: dados/<loja>/<arquivo>.xlsx
    # só escuta na própria VPS; o Caddy faz o HTTPS na frente
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Roda o script de cada loja (AppNext → planilha) na própria VPS.
  # Sem portas publicadas: só o painel fala com ele, pela rede interna do compose.
  coletor:
    build: ./coletor
    container_name: teashop-coletor
    init: true
    restart: unless-stopped
    user: "1000:1000"                 # mesmo usuário do painel: os dois gravam em dados/
    # Só o que o coletor precisa (o .env do painel tem senhas de e-mail, sessão, GitHub…: não vão para cá).
    # O docker compose lê os valores do .env desta pasta; as credenciais de cada loja ficam em config/coletor/<loja>.env
    environment:
      TZ: America/Sao_Paulo
      HOME: /work
      COLETOR_TOKEN: ${COLETOR_TOKEN:-}
      COLETOR_HORARIOS: ${COLETOR_HORARIOS:-}
      COLETOR_JANELA: ${COLETOR_JANELA:-}
      COLETOR_XML: ${COLETOR_XML:-}
      COLETOR_ESTOQUE: ${COLETOR_ESTOQUE:-}
      COLETOR_TEMPO_MAX: ${COLETOR_TEMPO_MAX:-}
    volumes:
      - ./config/coletor:/config:ro   # <loja>.env com as credenciais do AppNext
      - ./dados:/data                 # grava dados/<loja>/importacaoA.xlsx
      - ./coletor-work:/work          # sessão do navegador e logs de cada loja
    shm_size: "1gb"                   # o Chromium precisa de memória compartilhada
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
